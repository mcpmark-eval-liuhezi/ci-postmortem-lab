name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    name: Build and lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show environment
        run: echo "Build job running on $(uname -a)"

      - name: Sanity check
        run: |
          test -f README.md
          echo "README present - build OK"

  deploy-check:
    name: Deploy smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Simulated deploy verification
        run: |
          echo "Verifying deployment healthcheck..."
          if [ ! -f ./healthcheck.ok ]; then
            echo "::error::Deploy healthcheck failed - missing ./healthcheck.ok"
            exit 1
          fi
